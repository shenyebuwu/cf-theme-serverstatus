name: Build ServerStatus Theme

on:
  push:
    branches: [main, master]
    paths: ['themes/serverstatus/**', 'src/utils/csp.js', 'src/frontend/utils/server.js', 'src/frontend/utils/osIcon.js', '.github/workflows/build-serverstatus-theme.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: serverstatus-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install, test and build
        working-directory: themes/serverstatus
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          BACKGROUND_IMAGE_MOBILE: ${{ secrets.BACKGROUND_IMAGE_MOBILE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Browser integration tests
        working-directory: themes/serverstatus
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: cf-theme-serverstatus
          path: themes/serverstatus/dist/
      - name: Append build to dist branch
        shell: bash
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/serverstatus-message.txt"
          git log -1 --format=%B "$GITHUB_SHA" > "$message_file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git worktree add "$RUNNER_TEMP/serverstatus-dist" -B dist origin/dist
          else
            git worktree add --detach "$RUNNER_TEMP/serverstatus-dist"
            git -C "$RUNNER_TEMP/serverstatus-dist" switch --orphan dist
          fi
          output="$RUNNER_TEMP/serverstatus-dist"
          # Only clear the dedicated output worktree; keep its .git metadata.
          find "$output" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -R themes/serverstatus/dist/. "$output/"
          git -C "$output" add --all
          git -C "$output" commit --allow-empty -F "$message_file"
          git -C "$output" push origin HEAD:dist
